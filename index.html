.sweep{animation:sweep 7s 3s infinite ease-in-out}.sheet .row{animation:rise .45s both}.sheet .row:nth-child(n+4){animation-delay:.05s}.sheet .row:nth-child(n+6){animation-delay:.1s}.sheet .row:nth-child(n+8){animation-delay:.15s}.sheet .row:nth-child(n+10){animation-delay:.2s}
body:before{content:"";position:fixed;inset:0;z-index:-1;opacity:.06;pointer-events:none;background:radial-gradient(circle at 50% 100%,#0000 46%,#fff 47%,#fff 49%,#0000 50%) 0 0/64px 32px,radial-gradient(circle at 50% 100%,#0000 46%,#fff 47%,#fff 49%,#0000 50%) 32px 16px/64px 32px}
@keyframes sweep{0%{transform:translateX(-80px) skewX(-18deg)}38%,100%{transform:translateX(700px) skewX(-18deg)}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}@keyframes fade{from{opacity:0}}@keyframes binin{from{opacity:0;transform:translateY(14px) scale(.92)}}
@keyframes pop{from{transform:scale(0);opacity:0}}@keyframes pulse{50%{transform:scale(1.9)}}@keyframes grow{from{width:0}}@keyframes draw{to{stroke-dashoffset:0}}
@keyframes wlev{from{transform:translateY(108px)}}@keyframes wave{to{transform:translateX(-50px)}}

<div id="app"><header><div class="logo"><svg viewBox="0 0 34 34"><rect width="34" height="34" rx="11" fill="#b0173f"/><path d="M7 26V19a5 5 0 0 1 10 0v7M17 26V19a5 5 0 0 1 10 0v7" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>Ma Cave</div><button class="ib" id="mn" aria-label="Plus d'options">⋯</button></header>

<script>
const CAP={};for(let i=1;i<=42;i++)CAP[i]=15;[1,2,3,4,5,6,37].forEach(i=>CAP[i]=3);[12,13,24,25,36].forEach(i=>CAP[i]=6);[38,39,40,41,42].forEach(i=>CAP[i]=10);
const COL={rouge:'#ff3b6b',blanc:'#ffd24a',rose:'#ff9ec4',bulles:'#4de0b4'},LB={rouge:'Rouge',blanc:'Blanc',rose:'Rosé',bulles:'Bulles'};
const $=id=>document.getElementById(id),Y=new Date().getFullYear(),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S;try{S=JSON.parse(localStorage.getItem('cave'))}catch(e){}S=S||{b:[],h:[]};
let T='cave',f='',q='',LA=null,Z=1,SO='nom',cur={};
const save=()=>{try{localStorage.setItem('cave',JSON.stringify(S))}catch(e){toast('Mémoire pleine : faites une sauvegarde')}};
function toast(t){const e=$('toast');e.textContent=t;e.style.display='none';void e.offsetWidth;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2300)}
const soonB=b=>b.until&&+b.until<=Y+1,inBin=n=>S.b.filter(b=>b.bin==n);
const match=b=>(!f||(f=='soon'?soonB(b):b.color==f))&&(!q||[b.name,b.vintage,b.region,b.appellation,b.notes].join(' ').toLowerCase().includes(q));
const dist=Math.hypot,RW=539,FL=308,CY0=58,M=5.6;
const R=4.4,P=11,ST={15:[[5,5,5],[4,4,4,3]],10:[[5,5],[4,3,3]],6:[[3,3],[2,2,2],[2,2,1,1]],3:[[3],[2,1],[1,1,1]]};
function slotsFor(inside,rx,ty,cap){
 for(const st of ST[cap]){const h=(st.length-1)*P;
  for(let d=0;d<=45;d+=.5)for(const sg of d?[1,-1]:[1]){const y0=ty+sg*d-h/2,p=[];
   st.forEach((m,ri)=>{for(let i=0;i<m;i++)p.push([rx+(i-(m-1)/2)*P,y0+ri*P])});
   if(p.every(q=>inside(q[0],q[1])))return{pts:p,r:R}}}
 return{pts:[],r:R}}
const GEO={};
for(let j=0;j<6;j++){const n=j+1,jx=j*100,cy=CY0;
 const p=j==0?`M0,0H50V${cy-50}A50,50 0 0 0 0,${cy}Z`:`M${jx-50},0H${jx+50}V${cy-50}A50,50 0 0 0 ${jx},${cy}A50,50 0 0 0 ${jx-50},${cy-50}Z`;
 const ins=(x,y)=>x>=M&&x<=RW-M&&y>=M&&y<=cy-2&&Math.abs(x-jx)<50&&dist(x-jx+50,y-cy)>50+M&&dist(x-jx-50,y-cy)>50+M;
 GEO[n]={p,bb:[Math.max(0,jx-50),0,100,cy],lab:[j==0?14:jx,-13],...slotsFor(ins,j==0?19:jx,14,CAP[n])}}
for(let r=0;r<6;r++)for(let c=0;c<6;c++){const n=7+r*6+c,cx=(r%2?0:50)+100*c,cy=CY0+50*r,cu=r<5,vx=(Math.max(cx-50,0)+Math.min(cx+50,RW))/2;
 const p=cu?`M${cx-50},${cy}A50,50 0 0 1 ${cx+50},${cy}A50,50 0 0 0 ${cx},${cy+50}A50,50 0 0 0 ${cx-50},${cy}Z`:`M${cx-50},${cy}A50,50 0 0 1 ${cx+50},${cy}Z`;
 const ins=(x,y)=>{if(x<M||x>RW-M)return false;if(y<=(cu?cy:cy-M))return y>=cy-27&&dist(x-cx,y-cy)<=50-M;return cu&&y<=cy+50-M&&Math.abs(x-cx)<50-M&&dist(x-cx+50,y-cy-50)>50+M&&dist(x-cx-50,y-cy-50)>50+M};
 GEO[n]={p,bb:[cx-50,cy-50,100,cu?100:50],lab:[vx,cy-38],...slotsFor(ins,vx,cy-12,CAP[n])}}
function caveSVG(){const act=f||q;let h='';
 for(let n=1;n<=42;n++){const g=GEO[n],bs=inBin(n),hit=act&&bs.some(match),full=bs.length>=CAP[n];
  h+=`<g class="bn${hit?' hit':''}" data-n="${n}" style="--d:${Math.round((g.bb[0]+g.bb[1]*1.5)*1.5)}ms"><path class="rim" d="${g.p}" fill="url(#nf)" stroke="${hit?'#fff':full?'#ffd27a':'#ffffff55'}" stroke-width="${hit?2.8:full?2:1.4}" stroke-linejoin="round"/>`+
  g.pts.map((p,i)=>{const b=bs[i],x=p[0].toFixed(1),y=p[1].toFixed(1),r=g.r;
   if(!b)return `<circle cx="${x}" cy="${y}" r="${r}" fill="#ffffff14" stroke="#ffffff66" stroke-width=".9"/>`;
   const c=COL[b.color];
   return `<g class="pb${b.id==LA?' new':''}" style="--bd:${i*28}ms" opacity="${act&&!match(b)?.15:1}"><circle cx="${x}" cy="${y}" r="${(r+1.6).toFixed(1)}" fill="${c}" opacity=".35"/>${soonB(b)?`<circle class="sr" cx="${x}" cy="${y}" r="${r+1}"/>`:''}<circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/><circle cx="${x}" cy="${y}" r="${r}" fill="url(#shn)"/></g>`}).join('')+'</g>'}
 let l='';for(let n=1;n<=42;n++){const g=GEO[n],k=inBin(n).length,x=g.lab[0],y=g.lab[1],fl=k>=CAP[n];l+=`<g pointer-events="none"><circle cx="${x}" cy="${y}" r="6.8" fill="${fl?'url(#fg)':k?'#ffffff':'#ffffff22'}" stroke="${k?'none':'#ffffff66'}" stroke-width=".9"/><text x="${x}" y="${y+2.8}" text-anchor="middle" font-size="7.6" font-weight="700" font-family="system-ui,sans-serif" fill="${k?'#6e1241':'#ffffffcc'}">${n}</text></g>`}
